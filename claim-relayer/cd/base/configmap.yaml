# ABOUTME: Non-secret relayer settings (see ../../.env.example), passed to the container as environment.
# ABOUTME: The chain RPC comes from the overlay; escrow and sheet ids are in the Secret; the DB lives on /data.
apiVersion: v1
kind: ConfigMap
metadata:
  name: claim-relayer
data:
  DB_FILE: /data/relayer.db
  RETRY_MAX: "20"

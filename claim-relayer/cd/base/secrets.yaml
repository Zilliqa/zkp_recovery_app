# ABOUTME: The relayer key (it only pays gas) and the claim Form's response sheet ids, filled by z from 1Password.
# ABOUTME: The sheet ids stay out of git: the sheet is link-readable and lists claims not yet on-chain.
apiVersion: v1
kind: Secret
metadata:
  name: claim-relayer
  annotations:
    zilliqa.com/autofill: "claim-relayer"
type: Opaque
data:
  RELAYER_PRIVATE_KEY: ""
  ESCROW_ADDRESS: ""
  SHEET_ID: ""
  SHEET_GID: ""

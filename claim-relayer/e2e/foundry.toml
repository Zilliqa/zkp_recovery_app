[profile.default]
src = "src"
out = "out"
test = "test"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./claim.json" }]
# Match zq2's remappings so the vendored escrow_v1.sol/verifier.sol compile unchanged.
remappings = [
    "@openzeppelin/contracts/=vendor/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=vendor/openzeppelin-contracts-upgradeable/contracts/",
]
